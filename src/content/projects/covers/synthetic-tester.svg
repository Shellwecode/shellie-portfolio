  </g>
  <!-- five archetypes covering the corners where designs break -->
  <g fill="#2a2824">
    <circle cx="292" cy="176" r="5" opacity="0.4" />
    <circle cx="510" cy="182" r="5" opacity="0.4" />
    <circle cx="286" cy="330" r="5" opacity="0.4" />
    <circle cx="516" cy="322" r="5" opacity="0.4" />
    <circle cx="400" cy="250" r="6" opacity="0.55" />
    <circle cx="400" cy="250" r="22" fill="none" stroke="#2a2824" stroke-width="1" opacity="0.35" />
  </g>
  <text x="400" y="460" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#2a2824" opacity="0.55">synthetic ux tester · 2026</text>
</svg>

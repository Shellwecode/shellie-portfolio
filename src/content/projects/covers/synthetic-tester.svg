<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Synthetic UX Tester cover placeholder">
  <defs>
    <linearGradient id="sx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe8dc" />
      <stop offset="100%" stop-color="#a9b39c" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sx)" />
  <!-- the calibration plane: technical confidence × risk aversion -->
  <g stroke="#2a2824" stroke-width="1" opacity="0.3">
    <line x1="400" y1="110" x2="400" y2="390" />
    <line x1="230" y1="250" x2="570" y2="250" />
